<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>img2live — 퍼펫 스튜디오</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/studio.css">
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="/">img<b>2</b>live</a>
  <nav class="site" aria-label="주 메뉴"><a href="/">만들기</a><a href="/mine" aria-current="page">내 퍼펫 <span class="count" id="navMineCount"></span></a><a href="/about">소개</a><a href="/terms">약관</a><a class="ext" href="https://github.com/CocoRoF/img2live" rel="noopener">GitHub</a></nav>
</div></header>

<main class="app" id="app">
  <!-- loading / queued / running / failed / gone: one wide status view -->
  <div class="job-view" id="vStatus">
    <section class="card job-status" id="status" aria-live="polite">
      <div class="job-title">
        <h2 id="title">작업을 불러오는 중…</h2><span class="pill" id="badge">-</span>
      </div>
      <div class="progress" role="progressbar" aria-label="진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pbar"><i id="pfill"></i></div>
      <div class="stepper" id="stepper"></div>
      <p class="small muted" id="msg"></p>
      <div class="notice bad" id="err" hidden role="alert"></div>
      <p class="small muted" id="qinfo"></p>
      <p id="statusActions" hidden><a class="btn primary" href="/">새 퍼펫 만들기</a></p>
    </section>
    <aside class="card job-source" id="srcCard" hidden>
      <h3>올린 이미지</h3>
      <div class="job-source-img checker"><img id="srcImg" alt="업로드한 이미지"></div>
      <p class="small muted" id="srcPrompt"></p>
    </aside>
  </div>

  <!-- done: the studio.  [레이어 | 무대 | 검사기] fills the whole width and the height under the header -->
  <div class="studio" id="result" hidden data-left="open" data-right="open" data-drawer="none">
    <aside class="st-left" id="stLeft" aria-label="레이어 패널"><div id="layerPanel"></div></aside>
    <div class="st-split" id="splitL" role="separator" aria-orientation="vertical" aria-label="레이어 패널 너비 조절 (←→ 키)" tabindex="0"></div>

    <section class="st-center" id="stCenter" aria-label="무대" data-mode="stage">
      <div class="st-toolbar" id="stToolbar" role="toolbar" aria-label="무대 도구"></div>
      <div class="st-stagebox" id="stageBox"><div id="stageMount" class="st-stage"></div></div>
      <div class="st-chip" id="stChip" hidden aria-live="polite"></div>
      <div class="st-busy" id="stBusy" hidden role="status"><span class="st-spin" aria-hidden="true"></span><span id="stBusyText">퍼펫 갱신 중…</span></div>
      <div class="st-editor" id="editorBox" hidden>
        <div class="st-editor-bar">
          <button type="button" class="btn small" id="editorBack"></button>
          <span class="st-editor-title" id="editorTitle"></span>
        </div>
        <div class="st-editor-body" id="editorMount"></div>
      </div>
    </section>

    <div class="st-split" id="splitR" role="separator" aria-orientation="vertical" aria-label="검사기 너비 조절 (←→ 키)" tabindex="0"></div>
    <aside class="st-right" id="stRight" aria-label="검사기"><div id="inspector"></div></aside>
    <div class="st-scrim" id="stScrim" hidden></div>
  </div>
</main>

<footer class="site" id="siteFooter"><div class="wrap"><p>AI 생성물입니다. 업로드·결과는 비공개 링크로만 열리며 1년 뒤 자동 삭제됩니다. <a href="/terms">약관·고지</a></p></div></footer>
<div class="st-toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/static/js/nav.js"></script>
<script type="module" src="/static/js/job.js"></script>
<script type="module" src="/static/js/admin.js"></script>
</body>
</html>
