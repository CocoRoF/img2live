[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "img2live"
version = "0.1.0"
description = "One illustration + a prompt -> an animatable 2D puppet (layer decomposition, auto-rig, web viewer)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=2.0",
  "pillow>=11",
  "opencv-python-headless>=4.10",
  "scipy>=1.13",
]

[project.optional-dependencies]
# GPU worker: layer decomposition (LayerDiff3D)
engine = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "diffusers==0.37.0",
  "transformers==5.0.0",
  "accelerate==1.13.0",
  "safetensors==0.7.0",
  "huggingface-hub==1.7.2",
  "bitsandbytes==0.49.2",
  "einops",
  "psd-tools>=1.10",
]
# web API
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "onnxruntime>=1.18",
  "huggingface-hub>=0.24",
  "psd-tools>=1.10",
]
dev = ["pytest", "ruff", "playwright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
img2live = ["web/static/**/*"]

[tool.ruff]
line-length = 120
